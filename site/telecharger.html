<!doctype html>
<html lang="fr" data-theme="green">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Télécharger Brocolis 🥦 — macOS · Linux · Windows</title>
    <meta name="description" content="Téléchargez Brocolis pour macOS, Linux ou Windows : binaire universel macOS, paquets .deb / .rpm Linux, exécutable Windows." />
    <meta property="og:title" content="Télécharger Brocolis 🥦" />
    <meta property="og:description" content="macOS · Linux · Windows — la dernière build pour votre plateforme." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./brocolisMan.png" />
    <link rel="icon" type="image/png" href="./brocolisMan.png" />
    <script>
      // No-FOUC: apply persisted theme before first paint.
      (function () {
        try {
          var t = localStorage.getItem("brocolis.theme");
          if (t !== "green" && t !== "light" && t !== "dark") t = "green";
          document.documentElement.setAttribute("data-theme", t);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "green");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/download.tsx"></script>
  </body>
</html>
