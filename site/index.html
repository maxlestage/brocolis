<!doctype html>
<html lang="fr" data-theme="green">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brocolis 🥦 — Proxy MITM Rust de chiffrement sélectif</title>
    <meta name="description" content="Proxy MITM en Rust qui chiffre sélectivement le trafic HTTP/HTTPS sur Twitter, les forums, les messageries — sans rien changer côté serveur." />
    <meta property="og:title" content="Brocolis 🥦 — Chiffrement sélectif de votre trafic web" />
    <meta property="og:description" content="Une commande, zéro configuration. AES-256-GCM sur les segments que vous marquez." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./brocolisMan.png" />
    <link rel="icon" type="image/png" href="./brocolisMan.png" />
    <script>
      // No-FOUC: apply persisted theme before first paint.
      (function () {
        try {
          var t = localStorage.getItem("brocolis.theme");
          if (t !== "green" && t !== "light" && t !== "dark") t = "green";
          document.documentElement.setAttribute("data-theme", t);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "green");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
