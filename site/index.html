<!doctype html>
<html lang="fr" data-theme="green">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brocolis 🥦 — Proxy MITM Rust de chiffrement sélectif</title>
    <meta
      name="description"
      content="Proxy MITM en Rust qui chiffre sélectivement le trafic HTTP/HTTPS sur Twitter, les forums, les messageries — sans rien changer côté serveur."
    />
    <meta property="og:title" content="Brocolis 🥦 — Chiffrement sélectif de votre trafic web" />
    <meta
      property="og:description"
      content="Une commande, zéro configuration. AES-256-GCM sur les segments que vous marquez."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./brocolisMan.png" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f2a18" />

    <!-- Les trois pipelines Trunk. `data-wasm-opt` déclenche la passe de
         réduction de taille de binaryen sur le module compilé.
         `-all` est indispensable : rustc émet des instructions `memory.copy`
         (bulk memory), que wasm-opt refuse de valider si la fonctionnalité
         n'est pas explicitement activée — le build échoue sans ce paramètre. -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="-all" />
    <link data-trunk rel="css" href="styles.css" />
    <link data-trunk rel="copy-file" href="public/brocolisMan.png" />
    <link data-trunk rel="copy-dir" href="public/fonts" />
    <!-- La police du titre géant est demandée tout de suite, en parallèle du
         WebAssembly : sinon le héros s'afficherait d'abord dans la police de
         repli, puis sauterait. -->
    <link rel="preload" href="./fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" href="./brocolisMan.png" />

    <script>
      // Le thème est appliqué AVANT le premier rendu : sinon la page
      // s'afficherait en vert le temps que le WebAssembly démarre, puis
      // basculerait d'un coup pour qui a choisi clair ou sombre.
      (function () {
        try {
          var t = localStorage.getItem("brocolis.theme");
          if (t !== "green" && t !== "light" && t !== "dark") t = "green";
          document.documentElement.setAttribute("data-theme", t);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "green");
        }
      })();
    </script>
  </head>
  <body></body>
</html>
