[package]
name = "brocolis-site"
version = "0.1.0"
edition = "2024"
publish = false
description = "Site vitrine Brocolis — application WebAssembly (active)"
authors = ["Maxime Nathan Lestage <maxlestage@users.noreply.github.com>"]
license = "LicenseRef-Proprietary"

# Espace de travail autonome, volontairement vide. La racine du dépôt est
# elle-même un paquet Cargo (le proxy) : sans ce `[workspace]`, Cargo refuserait
# de compiler ce crate imbriqué avec « current package believes it's in a
# workspace when it's not ». Les deux cibles restent ainsi indépendantes : le
# proxy compile pour l'hôte, le site pour wasm32-unknown-unknown.
[workspace]

[dependencies]
# Bibliothèque front-end du même auteur (https://github.com/maxlestage/Active),
# épinglée sur une révision : le `dist` versionné doit pouvoir être reconstruit
# à l'identique. Rendu côté client uniquement (`client`) : le site est servi en
# statique, sans serveur Rust. La fonctionnalité est activée sur toutes les
# cibles — `cargo test` compile aussi pour l'hôte, où ce code n'est jamais
# exécuté.
active = { git = "https://github.com/maxlestage/Active", rev = "3b5c7468a37a644731f1d83e6c52b8c213a8481b", features = ["client"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "ImageData",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MutationObserver",
    "MutationObserverInit",
    "Navigator",
    "NodeList",
    "PointerEvent",
    "Storage",
    "Window",
] }
# `Array` et `Math.random` : les entrées d'un IntersectionObserver arrivent dans
# un tableau JS, et la poussière du héros a besoin d'un peu de hasard.
js-sys = "0.3"

# Le binaire part sur le réseau : on optimise la taille, pas le temps de
# compilation. `panic = "abort"` supprime la machinerie de déroulement, inutile
# en wasm où une panique arrête de toute façon l'instance.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
