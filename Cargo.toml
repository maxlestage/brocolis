[package]
name = "brocolis"
version = "0.1.0"
edition = "2021"
description = "Proxy MITM Rust pour le chiffrement sélectif du trafic HTTP/HTTPS"
license = "LicenseRef-Proprietary"
readme = "Readme.md"
homepage = "https://brocolis-dafbe9beac75.herokuapp.com/"
repository = "https://github.com/maxlestage/brocolis"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "brocolis"
path = "src/lib.rs"

# Binaire CLI (seul frontend).
[[bin]]
name = "brocolis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json", "stream"] }
aes-gcm = "0.11"
rand = "0.9"
# base64 0.23 active `simd-unsafe` par défaut, ce qui fait entrer du code
# `unsafe` dans le décodeur. Ce proxy décode du base64 issu du réseau, donc
# non fiable : on garde l'implémentation sûre. Le décodage n'est pas un
# goulot d'étranglement ici (jetons de quelques centaines d'octets).
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Accord de clé X25519 + HKDF-SHA256 (appairage automatique, clés de groupe),
# byte-compatible avec CryptoKit côté iOS.
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
# Client du serveur de rendez-vous (appairage automatique) + édition TOML qui
# préserve commentaires/format lors de l'ajout d'une clé dérivée au trousseau.
serde_json = "1"
toml_edit = "0.23"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
futures-core = "0.3.33"

# Dépendances de test uniquement.
[dev-dependencies]
serde_json = "1"
base64 = { version = "0.23", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# Packaging Linux (cargo deb / cargo generate-rpm). Voir linux/build-packages.sh.
# ---------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "Maxime Nathan LESTAGE <maxlestage@users.noreply.github.com>"
copyright = "© Maxime Nathan LESTAGE — Logiciel propriétaire, voir Readme.md"
license-file = ["Readme.md", "0"]
extended-description = """\
Brocolis chiffre sélectivement le trafic HTTP/HTTPS sur les services en ligne
(Twitter, forums, messageries) sans rien changer côté serveur. Les segments
((entre doubles parenthèses)) sont remplacés par un jeton chiffré
[[BROCOLIS:v1:…]] en AES-256-GCM ; les utilisateurs partageant la clé voient
le clair, le serveur ne stocke que du chiffré.

Le post-install crée un utilisateur système brocolis, génère le CA et un
brocolis.toml par défaut, ajoute le CA au magasin de confiance et active
le service systemd. Configurez votre navigateur sur le proxy HTTP+HTTPS
127.0.0.1:8080 (Firefox suit la politique entreprise déposée automatiquement).
"""
depends = "$auto, ca-certificates, adduser"
section = "net"
priority = "optional"
assets = [
    ["target/release/brocolis", "/usr/local/bin/", "755"],
    ["linux/brocolis.service", "/lib/systemd/system/brocolis.service", "644"],
    ["Readme.md", "/usr/share/doc/brocolis/README.md", "644"],
    ["linux/README.md", "/usr/share/doc/brocolis/LINUX.md", "644"],
]
maintainer-scripts = "linux/debian/"

[package.metadata.deb.systemd-units]
unit-name = "brocolis"
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
summary = "Proxy MITM Rust pour le chiffrement sélectif du trafic HTTP/HTTPS"
license = "Proprietary"
requires = { ca-certificates = "*" }
post_install_script = "linux/rpm/post-install.sh"
pre_uninstall_script = "linux/rpm/pre-uninstall.sh"
post_uninstall_script = "linux/rpm/post-uninstall.sh"
assets = [
    { source = "target/release/brocolis", dest = "/usr/local/bin/brocolis", mode = "755" },
    { source = "linux/brocolis.service", dest = "/lib/systemd/system/brocolis.service", mode = "644", config = false },
    { source = "Readme.md", dest = "/usr/share/doc/brocolis/README.md", mode = "644", doc = true },
    { source = "linux/README.md", dest = "/usr/share/doc/brocolis/LINUX.md", mode = "644", doc = true },
]
