[package]
name = "brocolis"
version = "0.1.0"
edition = "2021"
# Adresse de non-réponse GitHub, comme dans les métadonnées de paquet
# plus bas : le dépôt n'expose volontairement pas d'adresse personnelle.
authors = ["Maxime Nathan Lestage <maxlestage@users.noreply.github.com>"]
description = "Proxy MITM Rust pour le chiffrement sélectif du trafic HTTP/HTTPS"
license = "LicenseRef-Proprietary"
readme = "Readme.md"
homepage = "https://brocolis-dafbe9beac75.herokuapp.com/"
repository = "https://github.com/maxlestage/brocolis"

# Espace de travail : le proxy (ce paquet) et l'application de bureau
# (`app/`), qui partagent la bibliothèque et le même `target/`. Le site
# (`site/`) reste à part : il compile pour wasm32, avec son propre verrou.
[workspace]
members = [".", "app"]
exclude = ["site"]

[lib]
name = "brocolis"
path = "src/lib.rs"

# Binaire CLI (seul frontend).
[[bin]]
name = "brocolis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
# `x509-parser` active `Issuer::from_ca_cert_pem` : au rechargement, le
# signataire est reconstruit depuis le certificat racine STOCKÉ, et non depuis
# des paramètres réécrits à l'identique. Sans ça, une évolution du DN du CA
# ferait signer les feuilles par une autorité absente du magasin de confiance
# — l'interception casserait en silence sur les postes déjà équipés.
rcgen = { version = "0.14", features = ["x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "json", "stream"] }
aes-gcm = "0.11"
rand = "0.10"
# base64 0.23 active `simd-unsafe` par défaut, ce qui fait entrer du code
# `unsafe` dans le décodeur. Ce proxy décode du base64 issu du réseau, donc
# non fiable : on garde l'implémentation sûre. Le décodage n'est pas un
# goulot d'étranglement ici (jetons de quelques centaines d'octets).
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Accord de clé X25519 + HKDF-SHA256 (appairage automatique, clés de groupe),
# byte-compatible avec CryptoKit côté iOS.
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
# Client du serveur de rendez-vous (appairage automatique) + édition TOML qui
# préserve commentaires/format lors de l'ajout d'une clé dérivée au trousseau.
serde_json = "1"
toml_edit = "0.25"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
futures-core = "0.3.33"

# Dépendances de test uniquement.
[dev-dependencies]
serde_json = "1"
base64 = { version = "0.23", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# Packaging Linux (cargo deb / cargo generate-rpm). Voir linux/build-packages.sh.
# ---------------------------------------------------------------------------

[package.metadata.deb]
maintainer = "Maxime Nathan LESTAGE <maxlestage@users.noreply.github.com>"
copyright = "© Maxime Nathan LESTAGE — Logiciel propriétaire, voir Readme.md"
license-file = ["Readme.md", "0"]
extended-description = """\
Brocolis chiffre sélectivement le trafic HTTP/HTTPS sur les services en ligne
(Twitter, forums, messageries) sans rien changer côté serveur. Les segments
((entre doubles parenthèses)) sont remplacés par un jeton chiffré
[[BROCOLIS:v1:…]] en AES-256-GCM ; les utilisateurs partageant la clé voient
le clair, le serveur ne stocke que du chiffré.

Le paquet installe aussi l'application de bureau Brocolis (menu des
applications) : un interrupteur pour activer ou couper la protection, la
gestion des clés et l'appairage par code, le chiffrement d'un message.

Le post-install crée un utilisateur système brocolis, génère le CA et un
brocolis.toml par défaut, ajoute le CA au magasin de confiance et active
le service systemd. Configurez votre navigateur sur le proxy HTTP+HTTPS
127.0.0.1:8080 (Firefox suit la politique entreprise déposée automatiquement).
"""
# L'application de bureau charge à l'exécution (dlopen) les bibliothèques
# clavier X11 et OpenGL : `$auto` ne peut pas les déduire du binaire, elles
# sont donc déclarées ici. `pkexec` affiche la demande de mot de passe quand on
# active la protection depuis l'application.
depends = "$auto, ca-certificates, adduser, libxkbcommon-x11-0"
recommends = "pkexec | policykit-1, libegl1, libgl1"
section = "net"
priority = "optional"
assets = [
    ["target/release/brocolis", "/usr/local/bin/", "755"],
    ["target/release/brocolis-app", "/usr/local/bin/", "755"],
    ["linux/brocolis.desktop", "/usr/share/applications/brocolis.desktop", "644"],
    ["app/assets/brocolis.png", "/usr/share/icons/hicolor/256x256/apps/brocolis.png", "644"],
    ["Readme.md", "/usr/share/doc/brocolis/README.md", "644"],
    ["linux/README.md", "/usr/share/doc/brocolis/LINUX.md", "644"],
]
maintainer-scripts = "linux/debian/"

# `unit-scripts` : cargo-deb cherche l'unité dans le dossier des scripts de
# maintenance (`linux/debian/`) par défaut. Elle est dans `linux/` : sans cette
# ligne, il ne la trouvait pas, et le placeholder #DEBHELPER# restait VIDE — le
# service était copié mais jamais activé ni démarré (ni arrêté en
# désinstallant), contrairement à ce que la documentation annonce.
[package.metadata.deb.systemd-units]
unit-scripts = "linux/"
unit-name = "brocolis"
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
summary = "Proxy MITM Rust pour le chiffrement sélectif du trafic HTTP/HTTPS"
license = "Proprietary"
requires = { ca-certificates = "*", libxkbcommon-x11 = "*" }
recommends = { polkit = "*" }
post_install_script = "linux/rpm/post-install.sh"
pre_uninstall_script = "linux/rpm/pre-uninstall.sh"
post_uninstall_script = "linux/rpm/post-uninstall.sh"
assets = [
    { source = "target/release/brocolis", dest = "/usr/local/bin/brocolis", mode = "755" },
    { source = "target/release/brocolis-app", dest = "/usr/local/bin/brocolis-app", mode = "755" },
    { source = "linux/brocolis.desktop", dest = "/usr/share/applications/brocolis.desktop", mode = "644" },
    { source = "app/assets/brocolis.png", dest = "/usr/share/icons/hicolor/256x256/apps/brocolis.png", mode = "644" },
    { source = "linux/brocolis.service", dest = "/lib/systemd/system/brocolis.service", mode = "644", config = false },
    { source = "Readme.md", dest = "/usr/share/doc/brocolis/README.md", mode = "644", doc = true },
    { source = "linux/README.md", dest = "/usr/share/doc/brocolis/LINUX.md", mode = "644", doc = true },
]

# Binaires distribués : sans symboles de débogage (l'application de bureau
# passe ainsi d'environ 31 Mo à une dizaine), et liés avec une LTO légère.
[profile.release]
strip = true
lto = "thin"
