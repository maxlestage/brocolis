[package]
name = "brocolis"
version = "0.1.0"
edition = "2021"
description = "Proxy MITM Rust pour le chiffrement sélectif du trafic HTTP/HTTPS"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Métadonnées de bundle macOS (utilisées par `cargo bundle` et par
# scripts/build-macos-app.sh). L'app de bureau cible macOS.
[package.metadata.bundle]
name = "Brocolis"
identifier = "com.maxlestage.brocolis"
category = "public.app-category.utilities"
short_description = "Proxy MITM de chiffrement sélectif"
long_description = "Brocolis chiffre sélectivement le trafic HTTP/HTTPS désigné via un proxy MITM local."
osx_minimum_system_version = "11.0"

[lib]
name = "brocolis"
path = "src/lib.rs"

# Binaire CLI (par défaut).
[[bin]]
name = "brocolis"
path = "src/main.rs"

# Application de bureau (Linux / macOS / Windows). Nécessite `--features gui`.
[[bin]]
name = "brocolis-gui"
path = "src/bin/brocolis-gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "0.31", optional = true, default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
