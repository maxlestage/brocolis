name: Serveur du site

# Tests de non-régression de server.js (le serveur statique + relais /dl/*).
# Ils existent parce que « /% » ou « /%00 » suffisaient à tuer le processus.
# Aucune dépendance : le runner de test intégré à Node et un faux api.github.com.
on:
  push:
    branches: ['**']
    paths:
      - 'server.js'
      - 'tests/server.test.mjs'
      - 'scripts/check-dist.mjs'
      - 'package.json'
      - 'site/dist/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server.js'
      - 'tests/server.test.mjs'
      - 'scripts/check-dist.mjs'
      - 'package.json'
      - 'site/dist/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests du serveur
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Même plancher que `engines` dans package.json.
          node-version: '24.21'

      # Pas de build ici : le site est une application WebAssembly dont le
      # `site/dist` est versionné (voir .github/workflows/site.yml). Les tests
      # s'appuient dessus, donc on vérifie d'abord qu'il est complet.
      - name: Le site compilé est présent
        run: node scripts/check-dist.mjs

      - name: Tests du serveur
        run: npm test
