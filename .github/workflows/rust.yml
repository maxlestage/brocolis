name: Rust CI

# Compile le proxy, lance la suite de tests (unitaires + interop) et clippy.
# Tourne à chaque push/PR touchant au code Rust ou au manifeste.
on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'app/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'app/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les trois OS à chaque push, sur toutes les branches. Auparavant seul Linux
  # était vérifié ici : macOS et Windows ne l'étaient qu'au moment de publier,
  # sur master — c'est ainsi que la version Windows a pu rester cassée deux
  # mois sans que rien ne le signale.
  test:
    name: Build, test & clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache des dépendances
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Build & tests (proxy, CLI, application)
        run: cargo test --workspace --locked --all-targets

      - name: Clippy (zéro warning)
        run: cargo clippy --workspace --all-targets -- -D warnings
