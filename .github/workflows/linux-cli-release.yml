name: Linux CLI release

# Construit les paquets .deb et .rpm Linux pour brocolis et publie/actualise
# automatiquement une release GitHub rolling « cli-latest-linux ».
# Sur tag v*, produit aussi une release versionnée.
#
# Les tests d'intégration (linux/test-linux.sh) ne tournent PAS en CI : ils
# requièrent root et modifient le magasin de confiance / la politique Firefox
# / la config réseau. À jouer sur une vraie machine.

on:
  push:
    branches:
      - master
      - claude/rust-mitm-proxy-JHKLR
    tags:
      - "v*"
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "app/**"
      - "linux/**"
      - ".github/workflows/linux-cli-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, ex. v0.2.0 (doit être celle de Cargo.toml). Vide : build « dernier master »."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Publication d'une version à la main : elle doit être celle que
      # porte le code construit, sinon le paquet mentirait sur son numéro.
      - name: Vérifier la version demandée
        if: inputs.version
        shell: bash
        env:
          WANTED: ${{ inputs.version }}
        run: |
          HAVE="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "demandée : $WANTED — Cargo.toml : $HAVE"
          [[ "$WANTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "format attendu : vX.Y.Z"; exit 1; }
          [ "$WANTED" = "$HAVE" ] || { echo "la version demandée n'est pas celle de Cargo.toml"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo deb --version >/dev/null 2>&1 || cargo install cargo-deb --locked
          cargo generate-rpm --version >/dev/null 2>&1 || cargo install cargo-generate-rpm --locked
      - name: Tests (bibliothèque et application)
        run: |
          cargo test --lib --no-fail-fast
          cargo test -p brocolis-app --no-fail-fast
      # La ligne de commande ET l'application de bureau : les paquets
      # installent les deux (voir [package.metadata.deb] dans Cargo.toml).
      - name: Build release binaries
        run: cargo build --release --workspace --bin brocolis --bin brocolis-app
      - name: CLI smoke test
        run: |
          set -e
          # Sans accès admin, on vérifie au moins que la CLI répond et que
          # les sous-commandes pures fonctionnent.
          ./target/release/brocolis --help | grep -q 'brocolis'
          KEY=$(./target/release/brocolis keygen | head -1)
          test "${#KEY}" -ge 40 || { echo "clé trop courte: $KEY" >&2; exit 1; }
          TMP=$(mktemp -d)
          ./target/release/brocolis ca --ca-cert "$TMP/ca.crt" --ca-key "$TMP/ca.key" >/dev/null
          openssl x509 -in "$TMP/ca.crt" -noout -subject | grep -q 'Brocolis'
          rm -rf "$TMP"
          echo "✓ CLI smoke test OK"
      - name: Build .deb
        run: cargo deb --no-build -p brocolis
      - name: Build .rpm
        run: cargo generate-rpm
      - name: Contenu des paquets
        run: |
          set -e
          DEB=$(ls target/debian/*.deb | head -1)
          dpkg-deb -c "$DEB" | tee /tmp/deb.txt
          for f in usr/local/bin/brocolis usr/local/bin/brocolis-app \
                   usr/share/applications/brocolis.desktop \
                   usr/share/icons/hicolor/256x256/apps/brocolis.png; do
            grep -q "$f" /tmp/deb.txt || { echo "absent du .deb : $f" >&2; exit 1; }
          done
          dpkg-deb -f "$DEB" Depends | grep -q libxkbcommon-x11-0
          desktop-file-validate linux/brocolis.desktop || true
          RPM=$(ls target/generate-rpm/*.rpm | head -1)
          if command -v rpm >/dev/null; then
            rpm -qlp "$RPM" | grep -q /usr/local/bin/brocolis-app
          fi
          echo "✓ paquets complets"
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp target/debian/*.deb artifacts/
          cp target/generate-rpm/*.rpm artifacts/
          # Copies à nom STABLE (indépendant de la version) pour des liens de
          # téléchargement direct fiables depuis le site (page Télécharger).
          cp target/debian/*.deb artifacts/brocolis-linux-amd64.deb
          cp target/generate-rpm/*.rpm artifacts/brocolis-linux-x86_64.rpm
          ls -lh artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: brocolis-linux-packages
          path: artifacts/*

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect files
        id: collect
        run: |
          FILES=$(find artifacts -type f \( -name '*.deb' -o -name '*.rpm' \) | tr '\n' ' ')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release (branch)
        if: github.ref_type == 'branch' && !inputs.version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cli-latest-linux --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
          gh release create cli-latest-linux ${{ steps.collect.outputs.files }} \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Brocolis Linux (dernier ${GITHUB_REF_NAME})" \
            --notes "Build automatique du dernier ${GITHUB_REF_NAME} : application de bureau Brocolis et ligne de commande (.deb pour Debian/Ubuntu, .rpm pour Fedora/RHEL ; x86_64)." \
            --prerelease

      - name: Publish tagged release
        if: github.ref_type == 'tag' || inputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          # L'étiquette poussée, ou la version demandée : gh crée alors
          # l'étiquette sur le commit construit.
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "${VERSION}-linux" ${{ steps.collect.outputs.files }} \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Brocolis ${VERSION} Linux" \
            --notes "Release ${VERSION} pour Linux (.deb pour Debian/Ubuntu, .rpm pour Fedora/RHEL ; x86_64)."
