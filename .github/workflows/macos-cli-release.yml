name: macOS CLI release

# Compile le binaire CLI `brocolis` pour macOS (universel Intel + Apple
# Silicon) et publie automatiquement une release téléchargeable.
# Cible macOS uniquement. Aucune action manuelle nécessaire.

on:
  push:
    branches:
      - master
      - claude/rust-mitm-proxy-JHKLR
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Tests (bibliothèque et application)
        run: |
          cargo test --lib --no-fail-fast
          cargo test -p brocolis-app --no-fail-fast
      # La ligne de commande ET l'application, pour les deux architectures.
      - name: Build (Apple Silicon)
        run: cargo build --release --workspace --bin brocolis --bin brocolis-app --target aarch64-apple-darwin
      - name: Build (Intel)
        run: cargo build --release --workspace --bin brocolis --bin brocolis-app --target x86_64-apple-darwin
      - name: Universal binaries
        run: |
          mkdir -p target/universal
          for bin in brocolis brocolis-app; do
            lipo -create \
              target/aarch64-apple-darwin/release/$bin \
              target/x86_64-apple-darwin/release/$bin \
              -output target/universal/$bin
            lipo -info target/universal/$bin
          done
      # Bundle de l'application : Info.plist, icône, et la ligne de commande
      # embarquée (c'est elle que l'application lance avec les droits
      # administrateur pour `on` / `off`).
      - name: Brocolis.app
        run: |
          set -e
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='brocolis-app'))")
          APP=dist/Brocolis.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          sed "s/__VERSION__/$VERSION/g" macos/Info.plist > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          cp target/universal/brocolis-app "$APP/Contents/MacOS/brocolis-app"
          cp target/universal/brocolis "$APP/Contents/MacOS/brocolis"
          ICONSET=$(mktemp -d)/brocolis.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256; do
            sips -z $s $s app/assets/brocolis-512.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d app/assets/brocolis-512.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          cp app/assets/brocolis-512.png "$ICONSET/icon_512x512.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/brocolis.icns"
          # Signature ad hoc : sans elle, Apple Silicon refuse un bundle dont
          # les exécutables ont été recomposés par lipo.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          cp target/universal/brocolis dist/brocolis
      - name: Package
        run: tar -czf brocolis-macos-universal.tar.gz -C dist brocolis Brocolis.app
      - name: Smoke test (CLI + bundle)
        run: |
          set -e
          target/universal/brocolis --help | grep -q 'brocolis'
          KEY=$(target/universal/brocolis keygen | head -1)
          test "${#KEY}" -ge 40 || { echo "clé trop courte: $KEY" >&2; exit 1; }
          TMP=$(mktemp -d)
          target/universal/brocolis ca --ca-cert "$TMP/ca.crt" --ca-key "$TMP/ca.key" >/dev/null
          openssl x509 -in "$TMP/ca.crt" -noout -subject | grep -q 'Brocolis'
          file target/universal/brocolis | grep -q 'universal binary'
          file dist/Brocolis.app/Contents/MacOS/brocolis-app | grep -q 'universal binary'
          dist/Brocolis.app/Contents/MacOS/brocolis --version
          test -s dist/Brocolis.app/Contents/Resources/brocolis.icns
          tar -tzf brocolis-macos-universal.tar.gz | grep -q 'Brocolis.app/Contents/MacOS/brocolis-app'
          rm -rf "$TMP"
          echo "✓ CLI et Brocolis.app OK"
      - uses: actions/upload-artifact@v7
        with:
          name: brocolis-macos-universal
          path: brocolis-macos-universal.tar.gz

  release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect files
        id: collect
        run: |
          FILES=$(find artifacts -name '*.tar.gz' | tr '\n' ' ')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cli-latest --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
          gh release create cli-latest ${{ steps.collect.outputs.files }} \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Brocolis macOS (dernier ${GITHUB_REF_NAME})" \
            --notes "Build automatique du dernier ${GITHUB_REF_NAME} : application Brocolis.app et ligne de commande brocolis (macOS universel Intel + Apple Silicon)." \
            --prerelease

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ${{ steps.collect.outputs.files }} \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Brocolis ${GITHUB_REF_NAME} macOS" \
            --notes "Release ${GITHUB_REF_NAME} pour macOS : application Brocolis.app et ligne de commande (universel Intel + Apple Silicon)."
