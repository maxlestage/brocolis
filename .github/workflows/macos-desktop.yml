name: macOS desktop

# Construit l'application de bureau macOS (binaire universel Intel + Apple
# Silicon), assemble Brocolis.app + un .dmg, et publie automatiquement une
# release GitHub téléchargeable — sans aucune action manuelle.
# Doit tourner sur un runner macOS (le SDK Apple est indispensable).

on:
  push:
    branches:
      - master
      - claude/rust-mitm-proxy-JHKLR
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build (Apple Silicon)
        run: cargo build --release --features gui --bin brocolis-gui --target aarch64-apple-darwin

      - name: Build (Intel)
        run: cargo build --release --features gui --bin brocolis-gui --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/brocolis-gui \
            target/x86_64-apple-darwin/release/brocolis-gui \
            -output target/universal/brocolis-gui
          lipo -info target/universal/brocolis-gui

      - name: Assemble Brocolis.app
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          bash scripts/build-macos-app.sh target/universal/brocolis-gui dist "${VERSION}"

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - dist/Brocolis.app

      - name: Package .app (zip) and .dmg
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Brocolis.app dist/Brocolis-app.zip
          hdiutil create -volname Brocolis \
            -srcfolder dist/Brocolis.app \
            -ov -format UDZO dist/Brocolis.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brocolis-macos
          path: |
            dist/Brocolis-app.zip
            dist/Brocolis.dmg

      # Release "roulante" mise à jour à chaque push (master / branche de dev) :
      # téléchargeable directement depuis l'onglet Releases, sans manipulation.
      - name: Publish rolling release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag || true
          gh release create desktop-latest \
            dist/Brocolis.dmg dist/Brocolis-app.zip \
            --target "${GITHUB_SHA}" \
            --title "Brocolis desktop (dernier ${GITHUB_REF_NAME})" \
            --notes "Build automatique du dernier ${GITHUB_REF_NAME}. Binaire universel non notarisé : au 1er lancement, clic droit → Ouvrir." \
            --prerelease

      # Release versionnée sur tag v* (ex. v0.2.0).
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Brocolis.dmg dist/Brocolis-app.zip \
            --title "Brocolis ${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}. Binaire universel macOS non notarisé."
