name: Retirer l'ancienne release desktop-latest

# Usage unique, déclenché à la main : retire la pré-release « desktop-latest »
# (ancienne application de la branche claude/rust-mitm-proxy-JHKLR, mai 2026,
# jamais téléchargée), remplacée par les releases v0.2.0. La session de
# travail ne peut ni supprimer une release ni toucher aux étiquettes ; ce
# fichier est retiré du dépôt une fois exécuté.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retirer:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer la release et son étiquette
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete desktop-latest --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}"
