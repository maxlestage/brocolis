name: Windows CLI release

# Compile le binaire CLI `brocolis.exe` pour Windows x86_64 et publie
# automatiquement une release rolling `cli-latest-windows`.
# Sur tag v*, produit aussi une release versionnee vX.Y.Z-windows.
#
# Les tests d'integration (windows/install.ps1 / uninstall.ps1) ne
# tournent PAS en CI : ils requierent une vraie machine Windows avec
# admin + un Firefox installe pour valider la politique entreprise.

on:
  push:
    branches:
      - master
      - claude/rust-mitm-proxy-JHKLR
    tags:
      - "v*"
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "app/**"
      - "windows/**"
      - ".github/workflows/windows-cli-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Tests (bibliothèque et application)
        run: |
          cargo test --lib --no-fail-fast
          cargo test -p brocolis-app --no-fail-fast
      - name: Build
        run: cargo build --release --workspace --bin brocolis --bin brocolis-app
      - name: CLI smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "target/release/brocolis.exe"
          # Out-String : la sortie d'une commande est un TABLEAU de lignes, et
          # `tableau -notmatch motif` renvoie les lignes qui ne correspondent pas
          # (toujours « vrai » dès qu'une ligne ne cite pas le nom).
          $help = (& $bin --help | Out-String)
          if ($help -notmatch 'brocolis') { throw "--help n'a pas retourné l'aide attendue" }
          $key = (& $bin keygen | Select-Object -First 1).Trim()
          if ($key.Length -lt 40) { throw "clé trop courte : $key" }
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ([Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $caCrt = Join-Path $tmp 'ca.crt'
          $caKey = Join-Path $tmp 'ca.key'
          & $bin ca --ca-cert $caCrt --ca-key $caKey | Out-Null
          if (-not (Test-Path $caCrt)) { throw "ca.crt non généré" }
          $subj = (& certutil.exe -dump $caCrt | Out-String)
          if ($subj -notmatch 'Brocolis') { throw "subject CA ne contient pas 'Brocolis'" }
          Remove-Item -Recurse -Force $tmp
          $app = Get-Item target/release/brocolis-app.exe
          if ($app.Length -lt 1MB) { throw "brocolis-app.exe anormalement petit : $($app.Length)" }
          Write-Host '✓ CLI smoke test OK'
      - name: Stage release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item target/release/brocolis.exe artifacts/
          # L'application cherche brocolis.exe à côté d'elle : ils restent
          # dans le même dossier de l'archive.
          Copy-Item target/release/brocolis-app.exe artifacts/
          Copy-Item windows/install.ps1 artifacts/
          Copy-Item windows/uninstall.ps1 artifacts/
          Compress-Archive -Path artifacts/* -DestinationPath brocolis-windows-x86_64.zip -Force
          Get-Item brocolis-windows-x86_64.zip | Format-List FullName,Length
      - uses: actions/upload-artifact@v7
        with:
          name: brocolis-windows-x86_64
          path: brocolis-windows-x86_64.zip

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect files
        id: collect
        run: |
          FILES=$(find artifacts -name '*.zip' | tr '\n' ' ')
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release (branch)
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cli-latest-windows --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true
          gh release create cli-latest-windows ${{ steps.collect.outputs.files }} \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Brocolis Windows (dernier ${GITHUB_REF_NAME})" \
            --notes "Build automatique du dernier ${GITHUB_REF_NAME} (Windows x86_64). Inclut l'application brocolis-app.exe, la ligne de commande brocolis.exe, install.ps1 et uninstall.ps1." \
            --prerelease

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}-windows" ${{ steps.collect.outputs.files }} \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Brocolis ${GITHUB_REF_NAME} Windows" \
            --notes "Release ${GITHUB_REF_NAME} pour Windows (x86_64)."
